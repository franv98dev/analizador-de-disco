[package]
name = "analizador-de-disco"
version = "0.9.1"
edition = "2024"
description = "Escanea un disco y separa lo que creó una persona (fotos, videos, documentos, proyectos) de lo que es sistema o programas. Solo lectura."
license = "MIT"
repository = "https://github.com/franv98dev/analizador-de-disco"

[[bin]]
name = "analizador"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs4 = "1"
kamadak-exif = "0.6"
ratatui = "0.30"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Para saber si una unidad es un disco fijo, un pendrive o de red (pantalla de inicio).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
